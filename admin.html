<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin · Portfolio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <!-- Loading -->
    <div id="boot" class="boot">
      Loading…
    </div>

    <!-- Login view -->
    <div id="login-view" class="login-wrap hidden">
      <div class="login-card">
        <div class="login-box">
          <h1>Administrator Sign In</h1>
          <p class="sub">Restricted area — approved administrator accounts only.</p>
          <div id="login-body"></div>
        </div>
        <p class="login-back"><a href="index.html">← Back to portfolio</a></p>
      </div>
    </div>

    <!-- App view -->
    <div id="app-view" class="app hidden">
      <div class="topbar">
        <span class="t">Portfolio CMS</span>
        <button id="mobile-toggle" aria-label="Toggle menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
      <aside class="sidebar" id="sidebar">
        <div class="sb-head">
          <div class="t">Portfolio CMS</div>
          <div class="e" id="sb-email"></div>
        </div>
        <nav class="sb-nav" id="sb-nav"></nav>
        <div class="sb-foot">
          <a href="index.html?preview=1" target="_blank" rel="noopener">Preview site ↗</a>
          <button class="signout" id="signout">Sign out</button>
        </div>
      </aside>
      <main class="content" id="content"></main>
    </div>

    <script type="module" src="js/admin/app.js"></script>
  </body>
</html>
